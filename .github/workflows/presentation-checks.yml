name: Presentation checks
on:
  pull_request:
    paths: ['presentation/**', '.github/workflows/presentation-checks.yml']
  push:
    branches: ['plan/presentation-evolution']
    paths: ['presentation/**', '.github/workflows/presentation-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
