name: Course CI

on:
  pull_request:
    paths: ["course/**", "projects/Fixed income/**", ".github/workflows/course-*.yml"]
  push:
    branches: [main, "course/**"]
    paths: ["course/**", "projects/Fixed income/**", ".github/workflows/course-*.yml"]
  workflow_dispatch:

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: course } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: course/.nvmrc, cache: npm, cache-dependency-path: course/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run performance:static
      - uses: actions/upload-artifact@v4
        with: { name: course-pages-artifact, path: course/dist, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: course-static-evidence, path: course/evidence/build-evidence.json, if-no-files-found: error }

  browser:
    needs: validate-build
    strategy:
      fail-fast: false
      matrix: { browser: [chromium, firefox, webkit] }
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: course } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: course/.nvmrc, cache: npm, cache-dependency-path: course/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }} --grep-invert="visual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-browser-${{ matrix.browser }}
          path: course/evidence/playwright-report
          if-no-files-found: ignore

  visual-regression:
    needs: validate-build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: course } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: course/.nvmrc, cache: npm, cache-dependency-path: course/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test visual.spec.ts --project=chromium
      - if: always()
        run: npm run contact-sheets
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: course-visual-evidence, path: "course/{test-results,evidence/playwright-report,evidence/screenshots,evidence/contact-sheets}", if-no-files-found: ignore }
