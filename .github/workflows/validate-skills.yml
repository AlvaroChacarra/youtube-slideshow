name: Validate skills

on:
  push:
    branches:
      - skill-branch
  pull_request:
    branches:
      - skill-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate contracts and skill boundaries
        run: node scripts/validate-skills.mjs
