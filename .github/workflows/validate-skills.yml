name: Validate immersive slide engine V3

on:
  push:
    branches:
      - skill-branch
      - v3/immersive-slide-enhancement
  pull_request:
    branches:
      - skill-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install --yes imagemagick
      - name: Regenerate and validate V3
        run: npm test
